name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run build:agent
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build-desktop:
    needs: lint-typecheck-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run build:agent
      - run: npm run build --workspace=apps/desktop
      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f -w better-sqlite3
      - name: Headless smoke test
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          npm run smoke-test

  build-site:
    needs: lint-typecheck-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=apps/site
