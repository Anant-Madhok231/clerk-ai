name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build:core
      - run: npm run build:agent
      - run: npm run build --workspace=apps/desktop
      - name: Build macOS installers
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -z "$CSC_LINK" ] && unset CSC_LINK
          [ -z "$CSC_KEY_PASSWORD" ] && unset CSC_KEY_PASSWORD
          npm run dist:mac --workspace=apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: apps/desktop/release/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build:core
      - run: npm run build:agent
      - run: npm run build --workspace=apps/desktop
      - name: Build Windows installer
        env:
          CSC_LINK: ${{ secrets.WIN_CERTIFICATE_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CSC_LINK) { Remove-Item Env:\CSC_LINK -ErrorAction SilentlyContinue }
          if (-not $env:CSC_KEY_PASSWORD) { Remove-Item Env:\CSC_KEY_PASSWORD -ErrorAction SilentlyContinue }
          npm run dist:win --workspace=apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/release/*.exe

  publish:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos-installers/*.dmg
            dist/windows-installer/*.exe
          generate_release_notes: true
