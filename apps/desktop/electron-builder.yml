appId: com.anantmadhok.clerkai
productName: Clerk
copyright: Copyright © 2026 Anant Madhok

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - drizzle/migrations/**/*
  - package.json
  # Non-secret OAuth client id (PKCE, no client secret) so downloaded
  # builds can connect Gmail/Calendar without the user provisioning their
  # own Google Cloud project. Written by release.yml from a repo secret;
  # absent locally until you run the setup, which loadLocalEnv() handles.
  - .env.local

asarUnpack:
  - '**/*.node'

extraResources:
  - from: resources
    to: resources
  - from: build/icons
    to: build/icons

mac:
  icon: build/icon.icns
  category: public.productivity
  # No Apple Developer identity in this environment — build unsigned rather
  # than have electron-builder search for a local signing identity.
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # Stable across versions on purpose — the website links directly to these
  # filenames via releases/latest/download/ so it never needs updating per
  # release. The app's own version lives in the .dmg window title and the
  # bundle's CFBundleShortVersionString, not the filename.
  artifactName: '${productName}-macOS-${arch}.${ext}'

dmg:
  title: '${productName} ${version}'

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # Stable filename — see the mac artifactName comment above.
  artifactName: '${productName}-Setup.${ext}'

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
